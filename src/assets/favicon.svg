<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a" />
      <stop offset="50%" stop-color="#0f1422" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Neon Accent Cyan-Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Neon Magenta Accent Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>

    <!-- Glowing Play Triangle Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4" />
  
  <!-- Subtle Matrix Film Grid Lines Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8">
    <line x1="80" y1="16" x2="80" y2="496" />
    <line x1="432" y1="16" x2="432" y2="496" />
    <line x1="16" y1="120" x2="496" y2="120" />
    <line x1="16" y1="392" x2="496" y2="392" />
  </g>

  <!-- Film Perforations Edge Decor -->
  <g fill="url(#cyanGrad)" opacity="0.35">
    <rect x="42" y="50" width="16" height="24" rx="4" />
    <rect x="42" y="110" width="16" height="24" rx="4" />
    <rect x="42" y="378" width="16" height="24" rx="4" />
    <rect x="42" y="438" width="16" height="24" rx="4" />

    <rect x="454" y="50" width="16" height="24" rx="4" />
    <rect x="454" y="110" width="16" height="24" rx="4" />
    <rect x="454" y="378" width="16" height="24" rx="4" />
    <rect x="454" y="438" width="16" height="24" rx="4" />
  </g>

  <!-- Futuristic Geometric 'M' Structure -->
  <g filter="url(#neonGlow)">
    <!-- Left Leg of M -->
    <path d="M 120 380 L 120 145 C 120 135 130 128 140 134 L 236 210 L 236 380 Q 236 390 226 390 L 130 390 Q 120 390 120 380 Z" fill="url(#cyanGrad)" />
    
    <!-- Right Leg of M -->
    <path d="M 392 380 L 392 145 C 392 135 382 128 372 134 L 276 210 L 276 380 Q 276 390 286 390 L 382 390 Q 392 390 392 380 Z" fill="url(#cyanGrad)" />
  </g>

  <!-- Central Play Button Badge Overlay -->
  <g filter="url(#subtleGlow)">
    <!-- Shield / Play background circle -->
    <circle cx="256" cy="285" r="76" fill="#070913" stroke="url(#magentaGrad)" stroke-width="5" />
    <!-- Play Triangle -->
    <path d="M 238 245 L 292 285 L 238 325 Z" fill="url(#playGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
